# Killzone: Mercenary (PCSA00107, US). Only facts about the game (the format: pipeline/packconf.py).
NAME = "Killzone: Mercenary"
# REGION: the release this pack plays (its content id: UP..., North America); another region's release is another build,
# not played yet -- a search names it and says this release is the one Ativ plays
REGION = "US"
UPDATE_NOTE = "Update 1.12 adds Botzone and online play"
SPLIT = 32                # recompiled C split into this many part files (an 11.7 MB ELF, half again Unit 13's)
MODULES = "libc libgxm_es4 libgpu_es4 libfios2 libscemp4 libsceavplayer np_matching2 libssl np_common librudp"   # np_matching2 libssl np_common librudp: online play (below); libscemp4 + libsceavplayer: the firmware's MP4 demuxer and movie player behind its SceAvPlayer movies (Movies_KZV/*.mp4, H.264 decoded by runtime/media/video.c); its sce_module: libc, libfios2, libult, libface, libsmart (dump/decrypted/PCSA00107/elf/); GXM as Sony's code like the other games; libfios2 as Sony's code because the game's data is a PSARC archive (game_data/data_ngp.psarc) read through FIOS's dearchiver
# transferred 2026-10-07: game files mirrored from the Vita (VitaShell FTP), executable and modules
# decrypted by FAGDec on the Vita and converted with decrypt/fself2elf.py (all SHA-256 verified).
# Frame 900 (30 s at its 30 fps) is the "Connection preferences" dialog (title, body text, three
# buttons: strips, UBC4 and U4U4U4U4 textures, the F16 text shader) -- the first thing the game draws.
# Its UI is SceSystemGesture drags over the front panel (runtime/input/gesture.c): a tap on NEVER CONNECT at
# frame 950 brings the Valor Update card, a tap on its CONTINUE at 1300 the main menu, the test frame.
# The software path takes ~0.28 s a frame on its UI, so the run needs more than the 300 s default.
# RECOMP_SRGB=1 (2026-10-16): its albedo textures are sRGB-encoded and its front end renders into an sRGB
# surface. Read as linear, every lit surface in the level came out several times too bright and the
# tonemap clipped the lobby to white ("lights way over saturated"); the menus get their teal fill and glow
MOD_HOOKS = "0x89016ce0:gxm_fp_create 0x8901620c:gxm_vp_create"   # Sony's shader patcher in the recompiled libgxm (runtime/core/hooks.c gxm_*: RECOMP_GXM_PATCHER_LOG); its RegisterProgram hook (the shader recipes) is vitarecomp's for every game
MOD_IHOOKS = "0x89017034:gxm_fp_made"   # CreateFragmentProgram's tail, just after it hands back the variant (the shader prebuild)
RUN_ENV = "RECOMP_GAME_OPTIONS=fov,scenery_detail,character_detail,online,private_server RECOMP_NET_SERVERS=kzv.online.scee.com,beta.kzv.online.scee.com RECOMP_SRGB=1 RECOMP_ASPECT_HOOK=1 RECOMP_HUD_DRAWS=scene RECOMP_SSAO=0x1000000:1:24 RECOMP_KZ_EVENTS=1 RECOMP_NGS_AT9_LOG=1"   # RECOMP_ASPECT_HOOK: wider aspect ratios on (IHOOKS kz_hfov + kz_aspect_b: Hor+, checked headless at 21:9 2026-10-17)
TEST_ENV = "RECOMP_GFX=soft RECOMP_SHADERS=interp RECOMP_CLOCK=fixed RECOMP_SRGB=1"
TEST_TOUCH = "950-960:690,916;1300-1310:1564,830"
TEST_FRAMES = 1500
TEST_TIMEOUT = 600
TEST_TOLERANCE = 1

# Online play (docs/online.md; the online build of 2026-10-24, KZ_NP_MODULES=1, is every build since 2026-10-25): matchmaking
# as Sony's own code, the firmware's np_matching2 (what sceSysmoduleLoadModule(NP_MATCHING2) loads on a Vita: rooms,
# signaling), libssl (its TLS connections, crypto in software), np_common (the XML parser and timer service it uses; the
# host keeps its NP auth calls, runtime/core/main.c host_preferred) and librudp (the game's own transport between players),
# last in MODULES so the ones before keep their bases (MOD_HOOKS); the game's login server answered in its own process
# (server.c). Online is the player's setting (settings "online", on unless turned off; runtime/net/net.h net_online).

# The builds of the game this pack plays, a [versions."<version>"] table each: the SHA-256 of its eboot.bin.elf and its
# status (recommended: the one to play; supported: plays). vitarecomp import tells a copy's version by that hash and
# records it (the per-version settings below); a copy matching none is refused. 1.12 is the August 2015 update
# (ux0:patch/PCSA00107, layered over the game as app0_patched); Botzone (add-on P000000000001957) and the
# online modes exist only in its code.
# Per version: the hooks (HOOKS, IHOOKS) sit at different addresses in each build, the addresses their host code
# uses (GAME_ADDRS, runtime/core/hooks.c game_addr) too, and the functions the analysis misses (FUNCTION_SEEDS, from runs).
