# Uncharted: Golden Abyss (PCSA00029, US; the format: pipeline/packconf.py). The main code is uncharted.self (loaded by a 12 KB
# eboot.bin stub); the platform runs it directly as the main module (its export is named
# eboot.data.json so the pipeline stages stay uniform).
NAME = "Uncharted: Golden Abyss"
# REGION: the release this pack plays (its content id: UP..., North America); another region's release is another build,
# not played yet -- a search names it and says this release is the one Ativ plays
REGION = "US"
OTHER_TITLES = "PCSF00001"   # other releases' title ids, known to be this game (PCSF00001: the EU release, EP9000-PCSF00012)
SPLIT = 40                # ~3x Shovel Knight's code
ELF = "uncharted.self.elf"   # the main module (the eboot is a launcher)
FUNCTION_SEEDS = "0x8128ace2:thumb 0x8900264c:arm"   # functions the analysis misses, found on runs (a new copy needs them from its first build)
MODULES = "libc libgxm_es4 libgpu_es4 libfios2 libscemp4"   # libscemp4: the firmware's MP4 demuxer (SceMp4) for the game's movie player, which decodes with sceAvcdec* (runtime/media/video.c); sce_module/libc.suprx (C runtime, libm, the C++ library), and the firmware's libgxm and its GPU services library (GXM runs as Sony's code; gxm_sony.c observes its rendering boundary); libfios2: the game's own sce_module copy of Sony's FIOS (scheduler, PSARC dearchiver) over the host's sceIo calls (io.c)
# a scripted run to the main menu: tap the title screen; the game's real shaders
TEST_TOUCH = "2700-2710:960,544"
# RECOMP_NO_MSPACE=1 (the test only): with a working sceClibMspace heap (as on the console) the game plays
# its intro MP4 (SceMp4 -- libscemp4, above -- and sceAvcdec, runtime/media/video.c); with the heap's allocations
# failing the player never starts and the game goes straight to the title, which is what the test's
# scripted taps and reference frame were made for. Play runs with the heap (the movies play).
HOOKS = "0x816babb0:uc_proj 0x81202086:uc_gesture_end 0x812021e6:uc_gesture_update 0x81244476:uc_items_reset 0x81154ace:uc_balance_tick 0x811e1016:uc_slide_tick 0x81255338:uc_pvs_new 0x81255498:uc_pvs_free 0x812555b8:uc_pvs_free"   # uc_pvs_new/free (the live scenery sets: cPVSTable's constructor and destructors) + IHOOKS uc_zone_done: during a cutscene with a wider fov or aspect ratio, the level's own scenery (which the cutscene's layer hides) drawn past the cutscene set's frame (runtime/core/hooks.c, "The level's scenery past a cutscene's frame"); every perspective camera's projection builder (runtime/core/hooks.c uc_proj: the fov setting on the render camera's call; RECOMP_PROJ_TRACE logs its callers); the renderer's per-frame reset of its item pools (uc_items_reset: what a frame used, the view-distance budget's safety margin); a touch prompt's gesture success and its next update: the success is seen before the prompt's fade can end it (the machete minigame never started at a true 60 fps; runtime/core/hooks.c). Traces to hook here when needed (runtime/core/hooks.c, each behind its own variable): uc_lua_call/uc_lua_ret 0x8100e0ec/0x8100df00 (Lua calls), uc_warp_pause/speed/resume 0x816059ba/0x816059dc/0x816059f0 + uc_audio_sync 0x810cadd4 + uc_scene_owner 0x8133770a (the cutscene clock and its time warp), uc_pz_start/begin/end/finish/rubreset/progress/rub/load/charcoal 0x81081f8e/0x81082178/0x81081ab4/0x811292c2/0x8112854c/0x81128a96/0x8112945e/0x81081c2a/0x811289e4 + uc_transition 0x8102d494 (puzzles)
IHOOKS = "0x81289498:frame_dt 0x8129103e:frame_dt 0x812932c4:frame_dt 0x81153334:uc_path_end 0x812695b8:uc_mouse_look 0x810667ac:uc_look_velocity 0x81041090:uc_aspect 0x810412a6:uc_aspect 0x8104278e:uc_aspect 0x8105953a:uc_aspect 0x813f448c:uc_aspect 0x813f52aa:uc_aspect 0x810b442a:uc_aspect 0x8115b340:uc_aspect 0x812342e6:uc_aspect 0x8126cca6:uc_shape_threshold 0x8126ccb4:uc_shape_score 0x8114033c:uc_rub_wait_floor 0x81140b78:frames30 0x8103711c:frames30 0x81039418:frames30 0x816025c0:frame_dt 0x81255bd6:uc_pvs_union 0x810410bc:uc_fov_copy 0x8124233e:uc_item_pools 0x8134f732:uc_zone_done"   # uc_item_pools: the renderer's per-frame item pools made 4x larger at its setup, from the host's guest allocator (the view distance's extra draws; runtime/core/hooks.c); uc_fov_copy: the render camera's fov copy, scaled by the fov setting as HOOKS uc_proj scales its projection (runtime/core/hooks.c); uc_pvs_union: the view_distance setting (F10) -- the static world's visibility list widened to the PVS sample points around the camera and its fade-outs moved out with it, so the floor's rocks and foliage fade further away (runtime/core/hooks.c); frame_dt: the three per-frame 1/30 s steps get the real frame time at 60 fps, and so does the window in which a cutscene's camera cut is lined up with the world's clock (0x816025c0, fn_81602142) (runtime/core/hooks.c); frames30: counts of frames written for 30 fps, doubled at 60 -- the cutscene audio sync's 60-frame window at a voice stream's start (0x8103711c) and 5-frame window after a pause (0x81039418), and the wait after a tap on the sword before its charcoal rubbing starts (0x81140b78); uc_rub_wait_floor: that wait stops at 0 (a zoom that outlasted it took the count past 0 and the rubbing never started at 60 fps; runtime/core/hooks.c); uc_path_end: the 5 cm a character must get past a walked path's end before it is released, scaled by the frame time (characters ran in place at the end of logs at 60 fps; runtime/core/hooks.c); uc_mouse_look: fn_81269416 just after the right stick's dead-zone curve -- the mouse joins the stick there, before the game posts its input events; uc_look_velocity: the camera's turn velocity, just after it is set, made the mouse's exact amount (runtime/core/hooks.c); the movt of each of the nine places the game builds its 960/544 screen aspect (not the tenth, 0x81263480: the swipe recognizer's touch space, which stays the panel's): widened for wider aspect ratios (runtime/core/hooks.c uc_aspect), projection and culling together; uc_shape_threshold/uc_shape_score: a shape drawn with the mouse or the stick cursor is accepted at a $1-recognizer score of 0.7 ("touch_cursor_shape_threshold") instead of 0.8; a real touch keeps 0.8 (runtime/core/hooks.c)
RUN_ENV = "RECOMP_GAME_OPTIONS=fov,view_distance RECOMP_SRGB=1 RECOMP_ASPECT_HOOK=1 RECOMP_HUD_DRAWS=2d RECOMP_TARGET_SCALE=720x408:1.3333 RECOMP_CAMERA_LAMP=1"   # play: the GPU renderer, real shaders; wider aspect ratios on (HOOKS uc_proj: the world and cutscene camera widened, checked 2026-10-10 at 32:9 -- the frame squeezed, more of the scene at both sides); the mspace heap on, as on the console (movies play: runtime/media/video.c); gamma (sRGB) modes on -- without them sunlit scenes blew out yellow-white against the real Vita (2026-10-09, confirmed against real-Vita screenshots)
TEST_ENV = "RECOMP_GFX=soft RECOMP_SHADERS=interp RECOMP_NO_MSPACE=1 RECOMP_SRGB=1"   # no RECOMP_CLOCK=fixed: its loading screen is a PVRTC-textured full-screen draw the software interpreter renders in ~10 s a frame (pvrtc_texel per pixel); on the real clock the screen is time-limited so few of those frames render, on the fixed clock it needs its frames one by one (traced 2026-10-06 with RECOMP_DEBUGGABLE=1 + gdb on Linux). Fixed by a decoded-PVRTC texture cache in gfx_soft.c, not by the clock.   # the gate renders on the interpreter: the reference the GPU path is measured against
TEST_FRAMES = 3300        # the main menu (five items)
TEST_TIMEOUT = 420
TEST_TOLERANCE = 35        # the menu's jungle background (foliage, light shafts, water) animates on wall-clock time: correct runs differ by 10-30% of pixels; the broken frame (black with shafts) differed by 56-60%. Replace with a deterministic clock (README, Next 4).

# The build of the game this pack plays: [versions."<version>"], the SHA-256 of its uncharted.self.elf and its status
# (vitarecomp import refuses another version or region). 1.00, the game as installed: matched 2026-10-22 against a Vita's own copy
# (its ux0:app eboot, decrypted with its licence); Uncharted's 1.03 update isn't played yet -- its copy is told "not supported yet" and the game
# plays without it.
[versions."1.00"]
sha256 = "3c5d2b3a815ffb2f559efcb61dd1c524c2e9b960d01ab346d1778550e9485e08"
status = "supported"
