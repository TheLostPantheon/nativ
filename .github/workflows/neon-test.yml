name: NEON model test

on:
  pull_request:
    paths:
      - "recompiler/**"
      - "dev/tests/neon_test.py"
      - "requirements.txt"
      - ".github/workflows/neon-test.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "recompiler/**"
      - "dev/tests/neon_test.py"
      - "requirements.txt"
      - ".github/workflows/neon-test.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neon:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Run deterministic sample
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') == false
        run: python dev/tests/neon_test.py -n 2
      - name: Run full model
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: python dev/tests/neon_test.py
